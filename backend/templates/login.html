<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Assured Farming</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌾 Assured Farming
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </div>

</nav>


<div class="form-container">

    <div class="form-card">

        <h2>Login</h2>

        <p class="form-subtitle">
            Login to your account
        </p>

        <form method="POST">

            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="account-link">
            Don't have an account?
            <a href="/register">Register</a>
        </p>

    </div>

</div>

</body>
</html>
