<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Price Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🌾 Assured Farming
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/logout">Logout</a>
    </div>

</nav>


<div class="prediction-container">

    <h1>Crop Price Prediction</h1>

    <p>
        Enter the crop and market details to predict the expected modal price.
    </p>


    <form method="POST" action="/predict">

        <label>State</label>
        <input type="text" name="state" placeholder="Example: Karnataka" required>


        <label>District</label>
        <input type="text" name="district" placeholder="Example: Vijayapura" required>


        <label>Market</label>
        <input type="text" name="market" placeholder="Example: Vijayapura" required>


        <label>Commodity</label>
        <input type="text" name="commodity" placeholder="Example: Onion" required>


        <label>Variety</label>
        <input type="text" name="variety" placeholder="Example: Other" required>


        <label>Grade</label>
        <input type="text" name="grade" placeholder="Example: FAQ" required>


        <label>Minimum Price</label>
        <input type="number" step="0.01" name="min_price" required>


        <label>Maximum Price</label>
        <input type="number" step="0.01" name="max_price" required>


        <label>Year</label>
        <input type="number" name="year" value="2026" required>


        <label>Month</label>
        <input type="number" name="month" min="1" max="12" required>


        <label>Day</label>
        <input type="number" name="day" min="1" max="31" required>


        <label>Day of Week</label>
        <input type="number" name="day_of_week" min="0" max="6" required>


        <label>Quarter</label>
        <input type="number" name="quarter" min="1" max="4" required>


        <label>Season</label>
        <input type="text" name="season" placeholder="Example: Monsoon" required>


        <button type="submit">
            Predict Price
        </button>

    </form>


    {% if prediction %}

    <div class="prediction-result">

        <h2>Predicted Modal Price</h2>

        <p>
            ₹ {{ prediction }}
        </p>

    </div>

    {% endif %}


</div>

</body>
</html>
